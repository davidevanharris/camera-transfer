name: Build and test
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Compile app (iOS Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project CameraTransfer.xcodeproj \
            -scheme CameraTransfer \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Compile Watch app (watchOS Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project CameraTransfer.xcodeproj \
            -scheme CameraTransferWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee watch.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" watch.log
      - name: Run unit tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Simulator: $UDID"
          xcodebuild test \
            -project CameraTransfer.xcodeproj \
            -scheme CameraTransfer \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee test.log | grep -E "error:|Test Case.*(failed)|Executed|TEST (SUCCEEDED|FAILED)" || true
          if ! grep -q "TEST SUCCEEDED" test.log; then
            echo "---- failure detail ----"
            grep -nE "error|failed|Failing|XCTAssert|Restarting|crash|timed out" test.log | head -60
            echo "---- tail ----"
            tail -40 test.log
            exit 1
          fi
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            watch.log
            test.log
