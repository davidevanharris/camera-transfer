# XcodeGen fallback: `brew install xcodegen && xcodegen` regenerates CameraTransfer.xcodeproj
# (it overwrites the hand-written project file).
name: CameraTransfer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CameraTransfer:
    type: application
    platform: iOS
    sources:
      - path: CameraTransfer
        excludes:
          - Info.plist
          - CameraTransfer.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CameraTransfer
        PRODUCT_NAME: CameraTransfer
        INFOPLIST_FILE: CameraTransfer/Info.plist
        CODE_SIGN_ENTITLEMENTS: CameraTransfer/CameraTransfer.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Camera Transfer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  CameraTransferTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CameraTransferTests
    dependencies:
      - target: CameraTransfer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CameraTransferTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CameraTransfer.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CameraTransfer"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CameraTransfer:
    build:
      targets:
        CameraTransfer: all
        CameraTransferTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CameraTransferTests
